name: GitHub Repository Replica

on:
  workflow_dispatch:
    inputs:
      github_token:
        description: "GitHub Personal Access Token"
        required: true
        type: string

      source_repo_url:
        description: "Source Repository URL"
        required: true
        type: string

      target_repo_name:
        description: "Target Repository Name"
        required: true
        type: string

jobs:
  clone-repository:
    runs-on: ubuntu-latest

    steps:

      - name: Install GitHub CLI
        run: |
          gh --version

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Authenticate GitHub
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |
          gh auth status

      - name: Get Authenticated User
        id: github_user
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |
          USERNAME=$(gh api user --jq '.login')
          echo "username=$USERNAME" >> $GITHUB_OUTPUT

          echo "Authenticated User: $USERNAME"

      - name: Create Target Repository
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          gh repo create \
            "${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}" \
            --private

      - name: Clone Source Repository
        run: |

          git clone --bare \
            "${{ github.event.inputs.source_repo_url }}" \
            repo.git

      - name: Push All Branches
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          cd repo.git

          TARGET_URL="https://${GH_TOKEN}@github.com/${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}.git"

          git remote add target "$TARGET_URL"

          git push --all target

      - name: Push All Tags
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          cd repo.git

          TARGET_URL="https://${GH_TOKEN}@github.com/${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}.git"

          if ! git remote | grep -q target; then
            git remote add target "$TARGET_URL"
          fi

          git push target --tags

      - name: Verify Repository
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          echo ""
          echo "====================================="
          echo "Repository Clone Completed"
          echo "====================================="

          echo "Source Repository:"
          echo "${{ github.event.inputs.source_repo_url }}"

          echo ""
          echo "Target Repository:"

          echo "https://github.com/${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}"

      - name: List Branches
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          gh repo view \
            "${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}" \
            --json url

      - name: Success
        run: |
          echo "Repository replication completed successfully."
