name: Clone Repository

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: "Source Repository URL"
        required: true

      target_repo_name:
        description: "Target Repository Name"
        required: true

      branch_names:
        description: "Branches to Clone (comma-separated)"
        required: true

jobs:
  clone-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Repository
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh repo create "${{ github.event.inputs.target_repo_name }}" \
            --private \
            --confirm

      - name: Clone Source Repository
        run: |
          git clone --mirror "${{ github.event.inputs.source_repo_url }}" repo.git

      - name: Push Selected Branches
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TARGET_URL="https://${GH_TOKEN}@github.com/${{ github.repository_owner }}/${{ github.event.inputs.target_repo_name }}.git"

          git clone "${{ github.event.inputs.source_repo_url }}" source
          cd source

          IFS=',' read -ra BRANCHES <<< "${{ github.event.inputs.branch_names }}"

          git remote add target "$TARGET_URL"

          for branch in "${BRANCHES[@]}"; do
            git checkout "$branch"
            git push target "$branch"
          done

      - name: Push Tags
        run: |
          cd source
          git push target --tags
