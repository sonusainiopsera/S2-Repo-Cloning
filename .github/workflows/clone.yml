name: GitHub Repository Replica

on:
  workflow_dispatch:
    inputs:
      github_token:
        description: "GitHub Personal Access Token"
        required: true
        type: string

      source_repo_url:
        description: "Source Repository URL"
        required: true
        type: string

      target_repo_name:
        description: "Target Repository Name"
        required: true
        type: string

jobs:
  clone-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get Authenticated GitHub User
        id: github_user
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |
          USERNAME=$(gh api user --jq '.login')
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Extract Source Repository Details
        id: repo
        run: |
          REPO_PATH=$(echo "${{ github.event.inputs.source_repo_url }}" \
            | sed 's#https://github.com/##' \
            | sed 's#.git##')

          echo "repo_path=$REPO_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify Authentication
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |
          gh auth status

      - name: Create Target Repository
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |
          gh repo create \
            "${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}" \
            --private

      - name: Clone Source Repository
        run: |
          git clone --bare "${{ github.event.inputs.source_repo_url }}" repo.git

      - name: Push All Branches
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          cd repo.git

          TARGET_URL="https://${GH_TOKEN}@github.com/${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}.git"

          git remote add target "$TARGET_URL"

          git push --all target

      - name: Push All Tags
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          cd repo.git

          git push target --tags

      - name: Copy Repository Settings
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |

          SOURCE="${{ steps.repo.outputs.repo_path }}"
          TARGET="${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}"

          gh api repos/$SOURCE > repo.json

          gh api \
            --method PATCH \
            repos/$TARGET \
            -f description="$(jq -r '.description // ""' repo.json)" \
            -f homepage="$(jq -r '.homepage // ""' repo.json)" \
            -F has_issues=$(jq '.has_issues' repo.json) \
            -F has_projects=$(jq '.has_projects' repo.json) \
            -F has_wiki=$(jq '.has_wiki' repo.json) \
            -F allow_merge_commit=$(jq '.allow_merge_commit' repo.json) \
            -F allow_squash_merge=$(jq '.allow_squash_
