name: Clone Repository

on:
  workflow_dispatch:
    inputs:
      github_token:
        description: "GitHub Personal Access Token (PAT)"
        required: true
        type: string

      source_repo_url:
        description: "Source Repository URL"
        required: true
        type: string

      target_repo_name:
        description: "Target Repository Name"
        required: true
        type: string

jobs:
  clone-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create Target Repository
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |
          gh repo create "${{ github.event.inputs.target_repo_name }}" \
            --private

      - name: Mirror Clone Source Repository
        run: |
          git clone --mirror "${{ github.event.inputs.source_repo_url }}" repo.git

      - name: Push Complete Repository
        env:
          GH_TOKEN: ${{ github.event.inputs.github_token }}
        run: |
          cd repo.git

          TARGET_URL="https://${GH_TOKEN}@github.com/${{ github.repository_owner }}/${{ github.event.inputs.target_repo_name }}.git"

          git remote set-url origin "$TARGET_URL"

          git push --mirror

      - name: Summary
        run: |
          echo "Repository cloned successfully"
          echo "Source Repository: ${{ github.event.inputs.source_repo_url }}"
          echo "Target Repository: ${{ github.event.inputs.target_repo_name }}"
